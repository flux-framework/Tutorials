# To regenerate, in a QFw checkout at QFW_REF:
#   printf '%s\n' 'qrmi==0.24.4' 'iqm-qdmi>=1.4' 'mqt-core==3.9.2' \
#       'jsonschema>=4' pip setuptools wheel > /tmp/tutorial-extra.txt
#   uv pip compile --universal --python-version 3.12 --no-header \
#       setup/build-requirements.txt setup/requirements.txt /tmp/tutorial-extra.txt \
#       --override setup/overrides.txt -o qfw-requirements.lock

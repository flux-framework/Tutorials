- title: "Coscheduling quantum and classical work with QRMI"
  description: One submit, two jobs. A scout opens the vendor session and a held classical job waits for it, first on a mock vendor and then on an IBM QPU through QRMI
  type: jupyterlab-commands
  icon: ./static/flux-icon.png
  source:
    - label: Flux Tutorial
      id: 'filebrowser:open-path'
      args:
        path: ./tutorial/module1/01_coscheduling_qrmi.ipynb
        icon: ./static/flux-icon.png
  catalog: Notebook


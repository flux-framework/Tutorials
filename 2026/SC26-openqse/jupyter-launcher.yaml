- title: "QFw on Flux: Quantum Devices as Flux Resources"
  description: Hybrid jobs on simulators and a fake vendor queue. Open a terminal next to it and run the commands there.
  type: jupyterlab-commands
  icon: ./static/flux-icon.png
  source:
    - label: QFw Flux Tutorial
      id: 'filebrowser:open-path'
      args:
        path: ./qfw_flux_tutorial.ipynb
        icon: ./static/flux-icon.png
  catalog: Tutorial


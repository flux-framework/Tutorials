apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: lammps-flux
spec:
  # Reference the pre-defined runtime by name
  runtimeRef:
    name: flux-runtime
  trainer:
    numNodes: 1
    numProcPerNode: 64
    # The same ARM lammps image the MiniCluster example uses
    image: ghcr.io/converged-computing/lammps-reax-efa:ubuntu2404-efa
    # You do not need to write "flux run" here - the runtime wraps the
    # command across the nodes. The cd matters: in.reaxff.hns reads its
    # data file from the working directory.
    command:
      - lmp -v x 4 -v y 4 -v z 4 -in in.reaxff.hns -nocite
    env:
      # This is how we match the view (operating system and version) of the
      # initContainer that installs Flux. This one is built for ARM.
      - name: FLUX_VIEW_IMAGE
        value: ghcr.io/converged-computing/flux-view-rocky:arm-9
